<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pre-Plan Follow-Up Portal{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f5fa8'/><path d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/static/css/app.css?v={{ v }}">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% if user %}
<header class="topbar">
  <div class="brand"><span class="logo">✓</span><span>Pre-Plan Follow-Up</span>
    <span class="role-chip role-{{ user.role }}">{{ user.role|upper }}</span></div>
  <div class="who">
    <span class="who-name" title="{{ user.username }}">{{ user.display_name or user.username }}</span>
    <button class="btn btn-ghost btn-sm" id="btnChangePw" type="button">Password</button>
    <button class="btn btn-ghost btn-sm" id="btnLogout" type="button">Log out</button>
  </div>
</header>
{% endif %}
<main class="container">{% block content %}{% endblock %}</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="lightbox" class="lightbox"><button class="lb-close" type="button" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" type="button" aria-label="Previous">‹</button><img alt=""><button class="lb-nav lb-next" type="button" aria-label="Next">›</button>
  <div class="lb-cap"></div></dialog>
<dialog id="pwDialog" class="modal"><form method="dialog" id="pwForm">
  <h3>Change password</h3>
  <label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label>
  <label>New password (min 8)<input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
  <div class="row-end"><button class="btn btn-ghost" value="cancel" formnovalidate type="submit">Cancel</button><button class="btn btn-primary" id="pwSave" type="button">Save</button></div>
</form></dialog>
<script src="/static/js/common.js?v={{ v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
